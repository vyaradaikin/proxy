---
- hosts:
    - ru
    - non_ru
  become: true
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load local variable overrides
      include_vars: ../group_vars/all/local.yml
      ignore_errors: true

    - name: Load existing vault secrets
      include_vars: ../group_vars/all/vault.yml
      ignore_errors: true
      no_log: true

  tasks:
    - name: Check WireGuard tool
      command: wg --version
      register: remote_wg_tool
      changed_when: false

    - name: Generate RU WireGuard private key
      command: wg genkey
      register: generated_wg_ru_private_key
      changed_when: true
      no_log: true
      when:
        - inventory_hostname in groups.get('ru', [])
        - wg_ru_private_key is not defined or (wg_ru_private_key | default('', true) | length == 0) or wg_ru_private_key == 'CHANGEME'

    - name: Set RU WireGuard private key
      set_fact:
        final_wg_ru_private_key: "{{ generated_wg_ru_private_key.stdout | default(wg_ru_private_key | default('')) }}"
      no_log: true
      when: inventory_hostname in groups.get('ru', [])

    - name: Derive RU WireGuard public key
      command: wg pubkey
      args:
        stdin: "{{ final_wg_ru_private_key }}"
      register: derived_wg_ru_public_key
      changed_when: false
      no_log: true
      when: inventory_hostname in groups.get('ru', [])

    - name: Check Xray tool on RU
      command: "{{ xray_binary_path }} version"
      register: remote_xray_tool
      changed_when: false
      when: inventory_hostname in groups.get('ru', [])

    - name: Generate Xray client UUID
      command: cat /proc/sys/kernel/random/uuid
      register: generated_xray_client_id
      changed_when: true
      no_log: true
      when:
        - inventory_hostname in groups.get('ru', [])
        - xray_client_id is not defined or (xray_client_id | default('', true) | length == 0) or xray_client_id == 'CHANGEME-UUID'

    - name: Generate Xray Reality keypair
      command: "{{ xray_binary_path }} x25519"
      register: generated_xray_keypair
      changed_when: true
      no_log: true
      when:
        - inventory_hostname in groups.get('ru', [])
        - xray_reality_private_key is not defined or (xray_reality_private_key | default('', true) | length == 0) or xray_reality_private_key == 'CHANGEME'

    - name: Derive Xray Reality public key from existing private key
      shell: >-
        {{ xray_binary_path }} x25519 -i "$XRAY_REALITY_PRIVATE_KEY"
        | sed -n -e 's/^Public key: /Public key: /p' -e 's/^Password (PublicKey): /Password (PublicKey): /p'
      environment:
        XRAY_REALITY_PRIVATE_KEY: "{{ xray_reality_private_key }}"
      register: derived_xray_keypair
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - inventory_hostname in groups.get('ru', [])
        - xray_reality_private_key is defined
        - xray_reality_private_key | default('', true) | length > 0
        - xray_reality_private_key != 'CHANGEME'
        - xray_reality_public_key is not defined or (xray_reality_public_key | default('', true) | length == 0) or xray_reality_public_key in ['CHANGEME', 'None']

    - name: Generate Xray short ID
      command: openssl rand -hex 8
      register: generated_xray_short_id
      changed_when: true
      no_log: true
      when:
        - inventory_hostname in groups.get('ru', [])
        - xray_short_id is not defined or (xray_short_id | default('', true) | length == 0) or xray_short_id == 'CHANGEME'

    - name: Generate udp2raw password
      command: openssl rand -hex 32
      register: generated_wg_udp2raw_password
      changed_when: true
      no_log: true
      when:
        - inventory_hostname in groups.get('ru', [])
        - wg_udp2raw_password is not defined or (wg_udp2raw_password | default('', true) | length == 0) or wg_udp2raw_password in ['CHANGEME', 'None']

    - name: Set Xray generated facts
      set_fact:
        final_xray_client_id: "{{ generated_xray_client_id.stdout | default(xray_client_id | default('')) }}"
        final_xray_reality_private_key: "{{ (generated_xray_keypair.stdout_lines | default([]) | select('match', '^(Private key:|PrivateKey:)') | first | default('PrivateKey: ' ~ (xray_reality_private_key | default('')))).split(':', 1)[1] | trim }}"
        final_xray_reality_public_key: "{{ (generated_xray_keypair.stdout_lines | default([]) | select('match', '^(Public key:|Password \\(PublicKey\\):)') | first | default((derived_xray_keypair.stdout_lines | default([]) | select('match', '^(Public key:|Password \\(PublicKey\\):)') | first | default('PublicKey: ' ~ (xray_reality_public_key | default('', true)))))).split(':', 1)[1] | trim }}"
        final_xray_short_id: "{{ generated_xray_short_id.stdout | default(xray_short_id | default('')) }}"
        final_wg_udp2raw_password: "{{ generated_wg_udp2raw_password.stdout | default(wg_udp2raw_password | default('', true), true) }}"
      no_log: true
      when: inventory_hostname in groups.get('ru', [])

    - name: Generate Non-RU WireGuard private key
      command: wg genkey
      register: generated_wg_non_ru_private_key
      changed_when: true
      no_log: true
      when:
        - inventory_hostname in groups.get('non_ru', [])
        - wg_non_ru_private_key is not defined or (wg_non_ru_private_key | default('', true) | length == 0) or wg_non_ru_private_key == 'CHANGEME'

    - name: Set Non-RU WireGuard private key
      set_fact:
        final_wg_non_ru_private_key: "{{ generated_wg_non_ru_private_key.stdout | default(wg_non_ru_private_key | default('')) }}"
      no_log: true
      when: inventory_hostname in groups.get('non_ru', [])

    - name: Derive Non-RU WireGuard public key
      command: wg pubkey
      args:
        stdin: "{{ final_wg_non_ru_private_key }}"
      register: derived_wg_non_ru_public_key
      changed_when: false
      no_log: true
      when: inventory_hostname in groups.get('non_ru', [])

- hosts: localhost
  connection: local
  gather_facts: false
  vars:
    generated_vault_path: ../../.ansible/generated-vault.yml
  tasks:
    - name: Ensure local Ansible work directory exists
      file:
        path: "{{ generated_vault_path | dirname }}"
        state: directory
        mode: "0700"

    - name: Write generated plaintext vault payload
      copy:
        dest: "{{ generated_vault_path }}"
        mode: "0600"
        content: |
          ---
          wg_ru_private_key: {{ hostvars[groups.ru[0]].final_wg_ru_private_key }}
          wg_ru_public_key: {{ hostvars[groups.ru[0]].derived_wg_ru_public_key.stdout }}
          wg_non_ru_private_key: {{ hostvars[groups.non_ru[0]].final_wg_non_ru_private_key }}
          wg_non_ru_public_key: {{ hostvars[groups.non_ru[0]].derived_wg_non_ru_public_key.stdout }}
          wg_udp2raw_password: {{ hostvars[groups.ru[0]].final_wg_udp2raw_password }}

          xray_client_id: {{ hostvars[groups.ru[0]].final_xray_client_id }}
          xray_reality_private_key: {{ hostvars[groups.ru[0]].final_xray_reality_private_key }}
          xray_reality_public_key: {{ hostvars[groups.ru[0]].final_xray_reality_public_key }}
          xray_short_id: {{ hostvars[groups.ru[0]].final_xray_short_id }}
      no_log: true

    - name: Report generated vault payload
      debug:
        msg: "Generated plaintext payload at {{ generated_vault_path }}. Encrypt it with ansible-vault before applying server roles."
