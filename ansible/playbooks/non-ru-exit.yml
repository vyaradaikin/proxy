---
- hosts: non_ru
  become: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load local variable overrides
      include_vars: ../group_vars/all/local.yml
      ignore_errors: true

    - name: Load vault secrets
      include_vars: ../group_vars/all/vault.yml
      ignore_errors: true
      no_log: true

  roles:
    - common
    - wireguard_transport
    - wireguard
    - dns
    - wg_speedtest
    - xray_user_ui_proxy
    - firewall
