wg_interface: wg0

common_apt_manage_force_ipv4: false
common_apt_force_ipv4: true

wg_ru_ip: 10.100.0.2
wg_non_ru_ip: 10.100.0.1
wg_network: 10.100.0.0/24

wg_port: 51820
wg_mtu: 1380

wg_speedtest_enabled: true
wg_speedtest_port: 5201
wg_speedtest_duration: 10
wg_speedtest_parallel: 1
wg_speedtest_reverse: true

wg_transport: direct
wg_udp2raw_install: true
wg_udp2raw_download_url: https://github.com/wangyu-/udp2raw-tunnel/releases/latest/download/udp2raw_binaries.tar.gz
wg_udp2raw_local_port: 51821
wg_udp2raw_public_port: 4433
wg_udp2raw_raw_mode: faketcp
wg_udp2raw_mtu: 1200
wg_udp2raw_extra_args:
  - --fix-gro

ru_public_ip: 203.0.113.10
non_ru_public_ip: 198.51.100.10
non_ru_external_interface: eth0

xray_port: 443

xray_dest: example.com:443
xray_sni: example.com

xray_short_id: ""
xray_config_dir: /usr/local/etc/xray
xray_config_path: /usr/local/etc/xray/config.json
xray_clients_path: /usr/local/etc/xray/clients.json
xray_binary_path: /usr/local/bin/xray
xray_geo_dir: /usr/local/share/xray
xray_user: nobody
xray_domain_strategy: IPIfNonMatch
xray_sniffing_enabled: true
xray_sniffing_dest_override:
  - http
  - tls
  - quic
xray_sniffing_route_only: false
xray_client_dns_direct_enabled: true
xray_client_dns_direct_ports: "53,853"
xray_default_outbound_tag: non_ru
xray_direct_outbound_tag: direct
xray_ru_domains:
  - geosite:category-ru
  - geosite:yandex
  - regexp:.*\.ru$
  - regexp:.*\.su$
  - regexp:.*\.xn--p1ai$
xray_ru_ips:
  - geoip:ru
  - geoip:private

xray_user_ui_enabled: false
xray_user_ui_port: 19095
xray_user_ui_listen_address: "127.0.0.1"
xray_user_ui_basic_auth_user: admin

xray_user_backup_enabled: false
xray_user_backup_root: /backup/xray-users
xray_user_backup_interval: daily
xray_user_backup_retention_days: 30

monitoring_server_hosts: non_ru
monitoring_server_enabled: false
monitoring_prometheus_port: 19090
monitoring_alertmanager_port: 19093
monitoring_blackbox_port: 19115
monitoring_exporter_enabled: false
monitoring_node_exporter_port: 9100
monitoring_node_exporter_listen_address: "0.0.0.0"
monitoring_node_exporter_monitoring_listen_address: "127.0.0.1"
monitoring_include_self_node: true
monitoring_self_node_target:
  name: monitoring
  address: "127.0.0.1:{{ monitoring_node_exporter_port }}"
monitoring_scrape_source_ips: []
monitoring_wg_metrics_enabled: true
monitoring_speedtest_metrics_enabled: true
monitoring_speedtest_interval: 6h
monitoring_speedtest_run_on_all_hosts: false
monitoring_alert_wg_handshake_age_seconds: 180
monitoring_alert_speedtest_min_bps: 3000000
monitoring_alert_speedtest_max_age_seconds: 28800
monitoring_telegram_enabled: false
monitoring_telegram_bot_token: ""
monitoring_telegram_chat_id: ""
monitoring_telegram_api_url: https://api.telegram.org
monitoring_telegram_parse_mode: HTML
monitoring_public_enabled: false
monitoring_public_domain: ""
monitoring_public_basic_auth_user: admin

routing_table: wgexit
routing_table_id: 100
routing_mark: 100
routing_ru_service_egress_enabled: false
routing_ru_service_egress_tcp_ports:
  - 80
  - 443
  - 53
routing_ru_service_egress_udp_ports:
  - 53
  - 123
routing_ru_service_egress_excluded_users:
  - "{{ xray_user }}"
routing_ru_service_egress_excluded_ipv4_cidrs:
  - 0.0.0.0/8
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.2.0/24
  - 192.168.0.0/16
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/4
  - 240.0.0.0/4
routing_ru_service_egress_excluded_ipv4_addresses:
  - "{{ ru_public_ip }}"
  - "{{ non_ru_public_ip }}"
  - "{{ wg_ru_ip }}"
  - "{{ wg_non_ru_ip }}"

dns_non_ru_forwarder_enabled: false
dns_non_ru_bind_ip: "{{ wg_non_ru_ip }}"
dns_non_ru_listen_port: 53
dns_non_ru_filter_aaaa: true
dns_ru_manage_resolv_conf: false
dns_ru_nameservers:
  - "{{ wg_non_ru_ip }}"
dns_ru_search_domains: []
dns_ru_resolv_options:
  - timeout:2
  - attempts:3

firewall_ssh_port: 22
firewall_ru_tcp_ports:
  - "{{ firewall_ssh_port }}"
  - "{{ xray_port }}"
firewall_ru_udp_ports:
  - "{{ wg_port }}"
firewall_non_ru_tcp_allow_from_ru:
  - 443
  - 8888
firewall_non_ru_udp_ports:
  - "{{ wg_port }}"
