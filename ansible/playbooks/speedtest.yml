---
- hosts:
    - ru
    - non_ru
  become: true
  vars_files:
    - ../roles/wg_speedtest/defaults/main.yml
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load local variable overrides
      include_vars: ../group_vars/all/local.yml
      ignore_errors: true

    - name: Load vault secrets
      include_vars: ../group_vars/all/vault.yml
      ignore_errors: true
      no_log: true

  tasks:
    - name: Run WireGuard speedtest
      command: "{{ wg_speedtest_script_path }}"
      register: wg_speedtest_result
      changed_when: false

    - name: Show WireGuard speedtest result
      debug:
        var: wg_speedtest_result.stdout_lines
